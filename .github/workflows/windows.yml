name: Build Anomaly (Runtime, SDK, Tools)

on:
  workflow_dispatch: # 允许你手动点击按钮运行

jobs:
  build:
    runs-on: windows-latest # 使用微软最新的 Windows 服务器

    steps:
    - name: 1. 获取代码
      uses: actions/checkout@v4
      with:
        submodules: recursive # 拉取子模块

    - name: 2. 设置 MSBuild 环境
      uses: microsoft/setup-msbuild@v2

    - name: 3. 初始化 MSVC 编译环境
      uses: ilammy/msvc-dev-cmd@v1

    - name: 4. 运行官方构建脚本 (编译所有内容)
      shell: cmd
      run: |
        echo [INFO] 开始运行 build.cmd...
        call .\build.cmd

    - name: 5. 提取并安装 SDK 组件
      shell: cmd
      run: |
        echo [INFO] 正在提取 SDK...
        cmake --install .build\windows-vs2022 --config RelWithDebInfo --prefix .build\sdk-package --component SDK

    - name: 6. 打包成品 (Runtime 运行环境与 Tools 辅助工具)
      uses: actions/upload-artifact@v4
      with:
        name: Anomaly-Runtime-and-Tools
        path: .build\windows-vs2022\game-package
        retention-days: 7

    - name: 7. 打包成品 (SDK 开发工具包)
      uses: actions/upload-artifact@v4
      with:
        name: Anomaly-SDK
        path: .build\sdk-package
        retention-days: 7
