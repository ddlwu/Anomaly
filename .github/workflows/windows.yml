name: Build Anomaly (Runtime, SDK, Tools)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022 # 固定使用自带 VS 2022 的镜像环境

    steps:
    - name: 1. 获取代码
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: 2. 初始化 Visual Studio 编译环境
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat"
        cmake --version

    - name: 3. 运行官方构建脚本 (编译 Runtime 与 Tools)
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat"
        call .\build.cmd

    - name: 4. 提取并安装 SDK 组件
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat"
        cmake --install .build\windows-vs2022 --config RelWithDebInfo --prefix .build\sdk-package --component SDK

    - name: 5. 上传 Runtime 与 Tools 运行包
      uses: actions/upload-artifact@v4
      with:
        name: Anomaly-Runtime-and-Tools
        path: .build\windows-vs2022\game-package
        retention-days: 7

    - name: 6. 上传 SDK 开发包
      uses: actions/upload-artifact@v4
      with:
        name: Anomaly-SDK
        path: .build\sdk-package
        retention-days: 7
