name: Build Anomaly (Runtime, SDK, Tools)

on:
  workflow_dispatch: # 允许你手动点击按钮运行

jobs:
  build:
    runs-on: windows-latest # 使用微软最新的 Windows 服务器

    steps:
    - name: 获取代码
      uses: actions/checkout@v4
      with:
        submodules: recursive # 拉取子模块

    - name: 设置 MSBuild 环境
      uses: microsoft/setup-msbuild@v2

    - name: 运行官方构建脚本
      run: .\build.cmd

    - name: 打包编译好的成品 (Runtime, SDK, Tools)
      uses: actions/upload-artifact@v4
      with:
        name: Anomaly-Build-Package
        path: .build\windows-vs2022\game-package # 官方脚本的默认输出路径
        retention-days: 7 # 产物保留7天，过期自动删
